name: StackConnect

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  developmentRegion: en
  createIntermediateGroups: true
  groupSortPosition: none
  knownRegions:
    - en
    - de
    - es
    - es-MX
    - fr
    - it
    - ja
    - ko
    - nl
    - pt-BR
    - pt-PT
    - ru
    - sv
    - zh-Hant

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MTL_FAST_MATH: YES
    SDKROOT: iphoneos
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
  debug:
    DEBUG_INFORMATION_FORMAT: dwarf
    ENABLE_TESTABILITY: YES
    GCC_DYNAMIC_NO_PIC: NO
    GCC_OPTIMIZATION_LEVEL: "0"
    GCC_PREPROCESSOR_DEFINITIONS:
      - "DEBUG=1"
      - "$(inherited)"
    MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    ONLY_ACTIVE_ARCH: YES
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  release:
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ENABLE_NS_ASSERTIONS: NO
    SWIFT_COMPILATION_MODE: wholemodule
    VALIDATE_PRODUCT: YES

packages:
  netfox:
    url: https://github.com/rubensmachion/netfox
    branch: develop
  StackCore:
    path: Packages/StackCore
  StackCoreRust:
    path: Packages/StackCoreRust
  StackProtocols:
    path: Packages/StackProtocols
  APIProviderFirebase:
    path: Packages/APIProviderFirebase
  # Google Analytics for Firebase and Crashlytics. App target only (never the
  # widget). Pinned to an exact release; product `FirebaseAnalyticsCore` is the
  # no-IDFA variant.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1

# Files shown in the project navigator without belonging to any target.
# TipJar.storekit is the local StoreKit configuration used by the StackConnect
# and Fake Data schemes; it must never be bundled into the app.
fileGroups:
  - Configs/TipJar.storekit

targets:
  StackConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      # StackConnect/Resources/GoogleService-Info.plist (Firebase config) is
      # git-ignored and optional: the folder glob bundles it only when it exists
      # at `xcodegen generate` time, so open-source checkouts and CI build without
      # it, and Firebase is configured at runtime only when it is bundled. Do not
      # list it as an explicit `optional: true` source: XcodeGen still emits the
      # file reference and the build fails with "Build input file cannot be found".
      - path: StackConnect

    info:
      path: StackConnect/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleName: "$(APP_DISPLAY_NAME)"
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - zeroSixteen.stackconnect.refresh
        # Firebase privacy: nothing is collected until AnalyticsService enables
        # collection for a user whose setting is ON; no ad identifiers.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: true
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_REGISTRATION_WITH_AD_NETWORK_ENABLED: false
        # Crashlytics follows the same opt-out: off at every launch, turned on
        # by AnalyticsService (CrashlyticsProvider) only for a user whose
        # analytics setting is ON.
        FirebaseCrashlyticsCollectionEnabled: false
        # Sign in with Google: the iOS OAuth client ID, from GOOGLE_OAUTH_CLIENT_ID
        # in Configs/Debug.xcconfig / Configs/Release.xcconfig. The redirect uses
        # the reversed client ID through ASWebAuthenticationSession, so no URL
        # type is declared.
        GoogleOAuthClientID: "$(GOOGLE_OAUTH_CLIENT_ID)"
        # App Group (APP_GROUP_IDENTIFIER in Configs/*.xcconfig), read by
        # StackCore's AppGroup; must match StackConnect.entitlements.
        AppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        # Network audit (Settings › Privacy › Audit): Face ID before a recorded
        # token is revealed or put in a cURL export.
        NSFaceIDUsageDescription: "StackConnect uses Face ID before showing or exporting a token recorded in the network audit."

    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig

    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: StackConnect/StackConnect.entitlements
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The iPad app also runs on Apple silicon Macs ("Designed for iPad").
        # Not Mac Catalyst.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO

    dependencies:
      - package: netfox
        product: netfox
      - package: StackCore
      - package: StackCoreRust
        product: StackCoreRust
      - package: StackProtocols
      - package: APIProviderFirebase
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      # Remote feature flags (`RemoteFeatureFlagsBootstrap`). App target only.
      - package: Firebase
        product: FirebaseRemoteConfig
      - target: StackConnectWidgetExtension
        embed: true

    postBuildScripts:
      # Uploads the dSYM to Crashlytics (Firebase's documented `run` script from
      # the SPM checkout). Release builds for a device only, and a no-op (exit 0)
      # when GoogleService-Info.plist isn't bundled (open-source / CI builds) or
      # the checkout can't be found.
      # The dSYM and the binary are declared as inputs so Xcode schedules this
      # script only after the dSYM has been generated (Firebase's documented
      # setup). GoogleService-Info.plist is deliberately NOT an input: it is
      # optional, and a missing declared input fails the build.
      - name: Upload dSYM to Crashlytics
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Crashlytics: skipping dSYM upload (${CONFIGURATION} build)"
            exit 0
          fi
          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            echo "Crashlytics: skipping dSYM upload (simulator build)"
            exit 0
          fi
          if [ ! -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" ]; then
            echo "Crashlytics: skipping dSYM upload (no GoogleService-Info.plist bundled)"
            exit 0
          fi
          RUN_SCRIPT="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ ! -x "${RUN_SCRIPT}" ]; then
            echo "warning: Crashlytics run script not found at ${RUN_SCRIPT}; dSYM not uploaded"
            exit 0
          fi
          "${RUN_SCRIPT}"

  StackConnectWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: StackConnectWidget

    info:
      path: StackConnectWidget/Info.plist
      properties:
        CFBundleDisplayName: StackConnect
        CFBundleName: "$(PRODUCT_NAME)"
        # Same App Group as the app (APP_GROUP_IDENTIFIER), read by StackCore's
        # AppGroup; must match StackConnectWidget.entitlements.
        AppGroupIdentifier: "$(APP_GROUP_IDENTIFIER)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    # The app's xcconfigs (which include Version.xcconfig, and in Debug the
    # optional Local.xcconfig), so the widget shares the app's marketing version,
    # team, signing style and identity, App Group and bundle id prefix.
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig

    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: StackConnectWidget/StackConnectWidget.entitlements
        # DEVELOPMENT_TEAM, CODE_SIGN_STYLE and CODE_SIGN_IDENTITY come from the
        # app's xcconfigs, so the widget always signs like the app (a mismatch
        # fails the archive). Only the profile and the bundle id differ: the
        # widget needs its own match profile for the App Group entitlement.
        PROVISIONING_PROFILE_SPECIFIER: "$(WIDGET_PROVISIONING_PROFILE_SPECIFIER)"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # The app's bundle id (from the xcconfig layer) plus ".widget".
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).widget"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        # Ships inside the app, also on Mac ("Designed for iPad").
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO

    dependencies:
      - package: StackCore

  StackConnectTests:
    type: bundle.unit-test
    platform: iOS

    sources:
      - path: StackConnectTests
      # The widget extension's layouts and snapshot loader, compiled into the
      # tests so WidgetRenderingTests can render the home-screen widgets.
      - path: StackConnectWidget/Views
      - path: StackConnectWidget/Data

    info:
      path: StackConnectTests/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleAllowMixedLocalizations: true
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER_TESTS)"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"

    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER_TESTS)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StackConnect.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/StackConnect"

    dependencies:
      - target: StackConnect
      - package: StackCore

schemes:
  # The one app scheme: Run and Test use Debug, Profile and Archive use
  # Release (App Store / TestFlight builds come from here).
  StackConnect:
    build:
      targets:
        StackConnect: all
        StackConnectTests: [build, test]
    run:
      config: Debug
      executable: StackConnect
      # Local StoreKit testing for the tip jar (no App Store Connect needed).
      storeKitConfiguration: Configs/TipJar.storekit
      commandLineArguments:
        # DEBUG: shows the Home tip card right away (TipJarPromptService).
        "-TipJarCardForce YES": false
    test:
      config: Debug
      targets: [StackConnectTests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Runs the app on invented demo accounts (DEBUG-only fake data mode, see
  # docs/FAKE_DATA.md): no network, no Keychain, no App Group store. Toggle the
  # reset argument in the scheme editor to re-seed from scratch.
  StackConnect Fake Data:
    build:
      targets:
        StackConnect: all
    run:
      config: Debug
      executable: StackConnect
      storeKitConfiguration: Configs/TipJar.storekit
      commandLineArguments:
        "-StackFakeData YES": true
        "-StackFakeDataReset YES": false
        "-TipJarCardForce YES": false

  StackConnectTests:
    build:
      targets:
        StackConnect: [build, test]
        StackConnectTests: [build, test]
    test:
      config: Debug
      targets: [StackConnectTests]
